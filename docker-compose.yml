version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: antigravity_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: antigravity
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: antigravity_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
